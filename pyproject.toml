[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-quant-engine"
version = "0.1.0"
description = "Point-in-time research and decision engine for Indian equities"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "lightgbm>=4.5"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
quant-engine = "quant_engine.cli:main"

[tool.setuptools.packages.find]
include = ["quant_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
